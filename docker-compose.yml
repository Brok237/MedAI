# docker-compose.yml
# Runs the full stack locally:
#   - PostgreSQL
#   - Redis
#   - Django backend (port 8000)
#   - FastAPI ML service (port 8001)
#   - Celery worker

version: '3.9'

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       medai_db
      POSTGRES_USER:     medai_user
      POSTGRES_PASSWORD: medai_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medai_user -d medai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django Backend ─────────────────────────────────────────────────────────
  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    environment:
      DEBUG:            "True"
      SECRET_KEY:       "local-dev-secret-change-in-prod"
      DATABASE_URL:     "postgresql://medai_user:medai_pass@postgres:5432/medai_db"
      REDIS_URL:        "redis://redis:6379/0"
      FASTAPI_ML_URL:   "http://fastapi:8001"
      ALLOWED_HOSTS:    "localhost,127.0.0.1,0.0.0.0"
      CORS_ALLOW_ALL_ORIGINS: "True"
    volumes:
      - ./backend:/app
      - media_files:/app/mediafiles
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker ──────────────────────────────────────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info --concurrency 2
    environment:
      DEBUG:          "True"
      SECRET_KEY:     "local-dev-secret-change-in-prod"
      DATABASE_URL:   "postgresql://medai_user:medai_pass@postgres:5432/medai_db"
      REDIS_URL:      "redis://redis:6379/0"
      FASTAPI_ML_URL: "http://fastapi:8001"
    volumes:
      - ./backend:/app
    depends_on:
      - django
      - redis

  # ── FastAPI ML Service ─────────────────────────────────────────────────────
  fastapi:
    build:
      context: ./disease_api
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      DEBUG: "True"
    volumes:
      - ./disease_api:/app
      # Mount your ML artifacts here:
      # - ./ml_artifacts/sota_model.pkl:/app/sota_model.pkl
      # - ./ml_artifacts/label_encoder.pkl:/app/label_encoder.pkl
    ports:
      - "8001:8001"

volumes:
  postgres_data:
  media_files:
