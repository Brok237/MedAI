# render.yaml
# Deploy to Render with one click: https://render.com/docs/blueprint-spec
# Deploys Django backend + FastAPI ML service as separate web services.

services:

  # ── Django Backend ─────────────────────────────────────────────────────────
  - type: web
    name: medai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: medai-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: medai-redis
          type: redis
          property: connectionString
      - key: FASTAPI_ML_URL
        fromService:
          name: medai-ml-service
          type: web
          property: host
      - key: ALLOWED_HOSTS
        value: "medai-backend.onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
    healthCheckPath: /api/v1/auth/me/

  # ── FastAPI ML Service ─────────────────────────────────────────────────────
  - type: web
    name: medai-ml-service
    env: python
    rootDir: disease_api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health

  # ── Celery Worker ──────────────────────────────────────────────────────────
  - type: worker
    name: medai-celery
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker -l info --concurrency 2
    envVars:
      - key: SECRET_KEY
        fromService:
          name: medai-backend
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: medai-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: medai-redis
          type: redis
          property: connectionString

databases:
  - name: medai-postgres
    databaseName: medai_db
    user: medai_user
    plan: free

  - name: medai-redis
    plan: free
    type: redis
