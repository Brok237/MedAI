name: medai
description: AI-Assisted Drug Recommendation & Doctor Review Platform

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.1
  dio: ^5.4.3+1

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.3.1

  # Google Sign-In
  google_sign_in: ^7.2.0

  # File picker & image
  file_picker: ^12.0.0-beta.5
  image_picker: ^1.0.7

  # UI helpers
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fluttertoast: ^8.2.8
  lottie: ^3.1.0

  # Icons
  cupertino_icons: ^1.0.6
  flutter_feather_icons: ^2.0.0+1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # WebSocket
  web_socket_channel: ^3.0.3

  # Date picker
  intl: ^0.20.2

  # Connectivity
  connectivity_plus: ^7.1.1

  # Loading / status
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700